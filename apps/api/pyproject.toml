[project]
name = "cdd-api"
version = "0.1.0"
description = "Ciencia y Dios — API, HARNESS SUPRA, Evidence Engine y Experience OS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "langgraph>=0.2",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM117", "SIM102", "E501"]   # B008: patrón Depends() de FastAPI
