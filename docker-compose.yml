# Base de datos local para desarrollo: PostgreSQL 16 + pgvector (equivalente al Postgres de Supabase).
# Uso: docker compose up -d db
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"   # puerto poco común para no chocar con un PostgreSQL ya instalado
    volumes:
      - cdd-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cdd-pgdata:
